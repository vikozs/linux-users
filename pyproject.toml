[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-users"
version = "1.0.0"
description = "Account and access lifecycle audit and remediation for RHEL 9. Audit local accounts, sudoers and SSH keys; lock/expire stale accounts with re-validation. Never deletes."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Vid Kosir" }]
keywords = ["linux", "accounts", "users", "iam", "sudoers", "ssh-keys",
            "lifecycle", "audit", "rhel", "sysadmin", "fleet"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
    "Topic :: Security",
]
dependencies = ["openpyxl>=3.0"]

[project.urls]
Homepage = "https://github.com/vikozs/linux-users"
Issues = "https://github.com/vikozs/linux-users/issues"

[project.scripts]
linux-users = "linux_users:main"

[tool.setuptools]
py-modules = ["linux_users", "ssh_exec", "xlsx_safe"]
